start:
  position: -11
  type: image
  
beam_shaper:
  position: -10
  type: aperture
  shape: gaussian
  invert: 0
  power: 4
  size: 0.00065
  

CRL4a:
  in: 1
  position: -1.215
  type: Custom_CRL
  ROC: 30.0e-6   # Radius of curvature in [m]
  L: 2.6e-3      # Total mechanical lens thickness [m]
  A: 200.0e-6    # Geometric aperture radius [m]
  #focal_lenght_stack: 2.0
  nb_lenses: 3. # Number of lenses
  lens_material: diamond
  add_aperture: 1
  defects: 1     # Adding defects to the lens [0 or 1]
  experimental_data:
  - dabam2d-0073     # Name of the data used in DABAM
  - dabam2d-0084     # Name of the data used in DABAM
  - dabam2d-0079     # Name of the data used in DABAM
  rescale_dabam: 0  # [0] : no rescaling of the dabam map (be careful the the dabam map be larger than the simulation lens!) [1] : rescaling of the dabam map to match the lens size.
  defect_type: 1            # 1 = Zernike only, 2 = residues only, 3 = full (fit+res)
  remove_avg_profile: 0     # run average_azimuthal/remove_avg_profile on residues
  Custom_zernike:
    - 1                     # activate
    - 11                     # Noll n=7
    - 1.5e-6                  # amplitude [m]
  
TCSlit:
  in: 1
  elem: W
  r: 0.0002
  shape: wireslit
  size: 10.0e-06
  position: -0.001
  type: aperture
  orientate_horizontal: 1
  
TCC:
  type: imager
  position: 0
  VB_signal: 0
  
reg1:
  in: 0
  position: 1
  type: reg
  plot: 0
  
CRL4b:
  in: 1
  position: 2.422
  type: Custom_CRL
  ROC: 30.0e-6   # Radius of curvature in [m]
  L: 2.6e-3      # Total mechanical lens thickness [m]
  A: 200.0e-6    # Geometric aperture radius [m]
  #focal_lenght_stack: 2.0
  nb_lenses: 3. # Number of lenses
  lens_material: diamond
  add_aperture: 1
  defects: 1     # Adding defects to the lens [0 or 1]
  experimental_data: 
  - dabam2d-0073     # Name of the data used in DABAM
  - dabam2d-0084     # Name of the data used in DABAM
  - dabam2d-0079     # Name of the data used in DABAM
  rescale_dabam: 0  # [0] : no rescaling of the dabam map (be careful the the dabam map be larger than the simulation lens!) [1] : rescaling of the dabam map to match the lens size.
  defect_type: 3            # 1 = Zernike only, 2 = residues only, 3 = full (fit+res)
  remove_avg_profile: 1     # run average_azimuthal/remove_avg_profile on residues
  Custom_zernike:
    - 1                     # activate
    - 11                     # Noll n=7
    - 1.5e-6                  # amplitude [m]
    - 18                     # Noll n=7
    - -4.5e-6                  # amplitude [m]


PH:
  in: 1
  position: 5.293
  size: 80.0e-6
  invert: 1
  elem: Au
  thickness: 40.0e-06
  type: aperture
  shape: circle


Det:
  position: 7.5
  type: imager
  roi: 13
  roi2: 75


Xbeam:
  offset: 0
  size: 0.002
  photonenergy: 8766
  photons_total: 2e11          # photons in the pulse (at beam_shaper plane)
  X_FWHM_duration: 25e-15      # Xray FWHM duration [s].
  

IRLaser:
  phi_VB_deg: 45       # Polarisation angle between IRLaser and Xray beam
  IR_Energy_J: 4.8
  IR_FWHM_duration: 30e-15
  IR_wavelength: 800e-9
  IR_FWHM_gaussian: 1.3e-6 # FWHM diameter in the case of a Gaussian laser pulse
  IR_x_offset_m: 0
  IR_y_offset_m: 0
  Timing_jitter: 0.0      # Timing mismatch at focus between the pump and the probe, in [s].
  IR_2Dmap:
  - "external"        # Choose : "external" or "gaussian". Choose whether using an external 2D image or a gaussian map for the IR focus.
  - "match_peak"    # Choose : "match_integral" or "match_peak" to match the integral of the signal (such that the IR_Energy_J is matched) or the peak value of intensity for a  gaussian calculation.
  - "/home/yu79deg/darkfield_p5438/src/darkfield/IR_focus.png"       # Path of the external IR focus image
  - 0        #0.037 calibration in μm/pixel. If equal to = 0, the code will match the FWHM of external map laser to be equal to IR_FWHM_gaussian.


simulation:
  intensity_units: photons   # or 'relative'
  beamdiv: 0.0001
  do_positive: true
  focus_test: false
  focus_test_zoom: 150
  name: as_filename
  pptype: N
  project: Aime
  propsize: 0.002
  Zoom_global: 1 # Global zoom of all the simulation
  smooth: 0
  subfigure_size_px: 0       #before it was 1500
  version: 1
  intensity_ylim:
  - 1.0e-10
  - 2.0
  profiles_xlim:
  - 0
  - 200
  figs_to_save:
  - beam_shaper
  - O1
  - CRL4a  
  - TCSlit
  - TCC
  - PH
  - Det
  - flow
  figs_log: 1
  edge_damping:
  - 0.25
  edge_damping_shape: circular
  flow:
  - -10.0
  - 7.5
  - 0.05
  flow_auto_save: 0
  flow_plot_gyax:
  - -650.0
  - 650.0
  - 1.0
  flow_plot_clim:
  - 1e-11
  - 50


