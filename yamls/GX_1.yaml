start:
  position: -3.2
  type: image
  
beam_shaper:
  position: -3.1
  type: aperture
  shape: gaussian
  invert: 0
  power: 4
  size: 0.01


CRL4a:
  position: -3.0
  type: lens
  in: 1
  f: 3.0
  size: 0.02
  seiboth: false
  celestre: false
  scatterer: false
  
TCC:
  type: imager
  position: 0
  VB_signal: 0
  
Det:
  position: 3.0
  type: imager
  roi: 13
  roi2: 75
  
Xbeam:
  offset: 0
  size: 0.2
  photonenergy: 1.55
  photons_total: 2e11          # photons in the pulse (at START plane)
  X_FWHM_duration: 25e-15      # Xray FWHM duration [s].
  
simulation:
  intensity_units: photons   # or 'relative'
  beamdiv: 0.0
  do_positive: true
  focus_test: false
  focus_test_zoom: 150
  name: as_filename
  pptype: N
  project: Aime
  propsize: 0.03
  Zoom_global: 1 # Global zoom of all the simulation
  smooth: 0
  subfigure_size_px: 0
  version: 1
  intensity_ylim:
  - 1.0e-10
  - 2.0
  profiles_xlim:
  - 0
  - 200
  figs_to_save:
  - beam_shaper
  - CRL4a
  - TCC
  - Det
  - flow
  figs_log: 1
  edge_damping:
  - 0.25
  edge_damping_shape: circular
  flow:
  - -3.0
  - 3.0
  - 0.03
  flow_auto_save: 0
  flow_plot_gyax:
  - -400.0
  - 400.0
  - 1.0
  flow_plot_clim:
  - 1e-11
  - 50
